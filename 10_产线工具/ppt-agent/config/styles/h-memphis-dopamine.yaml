description: >
  高饱和高明度随机碰撞：芭比粉撞亮黄、蒂芙尼蓝配珊瑚橙。
  粗条纹渐变+水磨石纹理背景。刻意反网格——元素歪斜、
  随机散落、大小无序，页面充满"溢出来"的活泼感。
  顿点描边+波浪线+3D仿真符号。粗壮圆体+描边填充效果。
  Lo-Fi复古拼贴+像素风Icon+手绘涂鸦。
  适配快消品营销、创意比稿、高校招新、潮流策展。
